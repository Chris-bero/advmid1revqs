
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Finance — Midterm 1 Revision</title>
<meta name="description" content="Interactive midterm revision for Fundamentals of Corporate Finance: 44 MCQs with full bilingual (EN/AR) explanations, mock exams and formula sheets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   Corporate Finance — Midterm 1 Revision
   Stylesheet (light + dark themes, full EN/AR RTL support)
   ============================================================ */

:root{
  --font-en: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-ar: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Geeza Pro", "Arabic Typesetting", system-ui, sans-serif;
  --mono: "Cascadia Code", "Consolas", "SF Mono", Menlo, monospace;

  /* light theme */
  --bg: #eef1f8;
  --bg-grad-1: #e8ecf7;
  --bg-grad-2: #f3f0fa;
  --surface: #ffffff;
  --surface-2: #f6f8fc;
  --surface-3: #edf1f8;
  --border: #dfe5f0;
  --border-strong: #c6d0e2;
  --text: #16233b;
  --text-2: #4a5a76;
  --text-3: #7b89a3;
  --primary: #3b4fd8;
  --primary-soft: #e7eafc;
  --primary-ink: #2a38a0;
  --accent: #b45309;
  --accent-soft: #fef3c7;
  --ok: #15803d;
  --ok-soft: #dcfce7;
  --ok-border: #86efac;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --bad-border: #fca5a5;
  --warn-soft: #fff7e0;
  --warn-border: #f3d488;
  --shadow: 0 10px 30px -12px rgba(22, 35, 59, .18), 0 2px 8px rgba(22,35,59,.06);
  --shadow-sm: 0 2px 10px rgba(22,35,59,.08);
  --ring: rgba(59,79,216,.35);
  --chip-bg: #eef1f8;
}

html[data-theme="dark"]{
  --bg: #0c1322;
  --bg-grad-1: #0c1322;
  --bg-grad-2: #101a30;
  --surface: #141f36;
  --surface-2: #182542;
  --surface-3: #1e2e52;
  --border: #263859;
  --border-strong: #35507e;
  --text: #e8eefb;
  --text-2: #b3c0d8;
  --text-3: #8494b3;
  --primary: #7c8cf8;
  --primary-soft: #232f5e;
  --primary-ink: #aab6ff;
  --accent: #fbbf24;
  --accent-soft: #3a2f14;
  --ok: #4ade80;
  --ok-soft: #12321f;
  --ok-border: #2c5c3d;
  --bad: #f87171;
  --bad-soft: #3a1a1f;
  --bad-border: #6e2b33;
  --warn-soft: #33290f;
  --warn-border: #6b5a1e;
  --shadow: 0 12px 34px -14px rgba(0,0,0,.6), 0 2px 10px rgba(0,0,0,.3);
  --shadow-sm: 0 2px 10px rgba(0,0,0,.35);
  --ring: rgba(124,140,248,.4);
  --chip-bg: #1e2e52;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  font-family: var(--font-en);
  background:
    radial-gradient(1200px 500px at 85% -100px, var(--bg-grad-2), transparent 60%),
    radial-gradient(900px 420px at -100px -60px, var(--bg-grad-1), transparent 55%),
    var(--bg);
  color: var(--text);
  min-height:100vh;
  line-height:1.6;
  transition: background-color .25s, color .25s;
}
html[lang="ar"] body{ font-family: var(--font-ar); line-height:1.9; }

svg.ico, .brand-ico svg{ width:1em; height:1em; fill:currentColor; }
.u-bidi{ unicode-bidi: plaintext; }
.ltr{ direction:ltr; unicode-bidi:embed; }

/* ============ Top bar ============ */
.topbar{
  position:sticky; top:0; z-index:50;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:1180px; margin:0 auto; padding:.6rem 1.1rem;
  display:flex; align-items:center; gap:1rem;
}
.brand{ display:flex; align-items:center; gap:.65rem; text-decoration:none; color:var(--text); }
.brand-ico{
  width:42px; height:42px; border-radius:12px; flex:none;
  display:grid; place-items:center; font-size:24px; color:#fff;
  background: linear-gradient(135deg, var(--primary), #8b5cf6);
  box-shadow: var(--shadow-sm);
}
.brand-txt{ display:flex; flex-direction:column; line-height:1.25; }
.brand-txt strong{ font-size:1.02rem; letter-spacing:.2px; }
.brand-txt small{ color:var(--text-3); font-size:.74rem; }

.mainnav{ display:flex; gap:.35rem; margin-inline-start:auto; }
.nav-btn{
  display:flex; align-items:center; gap:.45rem;
  border:1px solid transparent; background:transparent; color:var(--text-2);
  padding:.5rem .85rem; border-radius:10px; cursor:pointer;
  font:inherit; font-size:.92rem; font-weight:600; transition:.15s;
}
.nav-btn .ico{ font-size:17px; }
.nav-btn:hover{ background:var(--surface-3); color:var(--text); }
.nav-btn.active{ background:var(--primary-soft); color:var(--primary-ink); border-color: color-mix(in srgb, var(--primary) 30%, transparent); }

.top-actions{ display:flex; gap:.4rem; }
.btn{
  font:inherit; font-weight:600; cursor:pointer; border-radius:10px;
  border:1px solid var(--border-strong); background:var(--surface);
  color:var(--text); padding:.5rem .95rem; display:inline-flex; align-items:center; gap:.5rem;
  transition:.15s; text-decoration:none;
}
.btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.btn:active{ transform:translateY(0); }
.btn .ico{ font-size:17px; }
.btn-primary{ background:linear-gradient(135deg, var(--primary), #6d5ce7); border-color:transparent; color:#fff; }
.btn-primary:hover{ filter:brightness(1.07); }
.btn-ghost{ background:transparent; border-color:var(--border); color:var(--text-2); }
.btn-ghost:hover{ background:var(--surface-3); color:var(--text); }
.btn-ok{ background:var(--ok-soft); border-color:var(--ok-border); color:var(--ok); }
.icon-only{ padding:.5rem; }
.lang-btn{ font-size:.9rem; }
:focus-visible{ outline:3px solid var(--ring); outline-offset:2px; border-radius:6px; }

/* ============ Layout ============ */
.app{ max-width:1180px; margin:0 auto; padding:1.4rem 1.1rem 3rem; }
.view{ animation:fadeUp .3s ease; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; box-shadow:var(--shadow-sm);
}
.grid{ display:grid; gap:1rem; }

/* ============ Hero (dashboard) ============ */
.hero{
  border-radius:20px; padding:1.7rem 1.8rem; color:#fff; position:relative; overflow:hidden;
  background: linear-gradient(130deg, #2b3ad0 0%, #5b3ad1 45%, #7c3aed 100%);
  box-shadow: var(--shadow);
  display:flex; gap:1.6rem; align-items:center; flex-wrap:wrap;
}
html[data-theme="dark"] .hero{ background: linear-gradient(130deg, #232f74 0%, #3b2f8f 50%, #4c2f86 100%); }
.hero::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(420px 180px at 90% -20%, rgba(255,255,255,.28), transparent 60%),
    radial-gradient(300px 160px at 10% 130%, rgba(255,255,255,.14), transparent 60%);
}
.hero-main{ flex:1 1 320px; position:relative; z-index:1; }
.hero h1{ font-size:clamp(1.45rem, 3vw, 2rem); letter-spacing:.2px; margin-bottom:.35rem; }
.hero p{ color:rgba(255,255,255,.88); max-width:56ch; font-size:.98rem; }
.hero-chips{ display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.9rem; }
.chip{
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28);
  color:#fff; border-radius:999px; padding:.22rem .8rem; font-size:.8rem; font-weight:600;
  display:inline-flex; align-items:center; gap:.4rem;
}
.hero-ring{ position:relative; z-index:1; flex:none; text-align:center; }
.ring-wrap{ position:relative; width:140px; height:140px; }
.ring-wrap svg{ transform:rotate(-90deg); }
.ring-track{ fill:none; stroke:rgba(255,255,255,.22); stroke-width:10; }
.ring-val{ fill:none; stroke:#fff; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .8s ease; }
.ring-label{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff;
}
.ring-label b{ font-size:1.7rem; line-height:1; }
.ring-label span{ font-size:.72rem; opacity:.85; }
.hero-actions{ display:flex; gap:.6rem; margin-top:1.1rem; flex-wrap:wrap; }
.hero-actions .btn{ border-color:rgba(255,255,255,.4); }
.btn-hero{ background:#fff; color:#3b3ad0; border-color:#fff !important; font-weight:700; }
.btn-hero-alt{ background:rgba(255,255,255,.14); color:#fff; }

/* ============ Stats strip ============ */
.stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:.9rem; margin-top:1.1rem; }
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:.95rem 1.1rem; display:flex; align-items:center; gap:.85rem; box-shadow:var(--shadow-sm);
}
.stat-ico{
  width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:21px; flex:none;
}
.stat-ico.blue{ background:var(--primary-soft); color:var(--primary-ink); }
.stat-ico.green{ background:var(--ok-soft); color:var(--ok); }
.stat-ico.red{ background:var(--bad-soft); color:var(--bad); }
.stat-ico.gold{ background:var(--accent-soft); color:var(--accent); }
.stat b{ font-size:1.35rem; display:block; line-height:1.2; }
.stat span{ color:var(--text-3); font-size:.8rem; font-weight:600; }

/* ============ Section headings ============ */
.sec-head{ display:flex; align-items:baseline; gap:.8rem; margin:1.8rem 0 .9rem; flex-wrap:wrap; }
.sec-head h2{ font-size:1.25rem; }
.sec-head .muted{ color:var(--text-3); font-size:.88rem; }
.muted{ color:var(--text-3); }

/* ============ Topic cards (dashboard) ============ */
.topics{ grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); }
.topic{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:1.15rem 1.25rem; box-shadow:var(--shadow-sm); transition:.18s; position:relative; overflow:hidden;
}
.topic:hover{ transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--border-strong); }
.topic-top{ display:flex; align-items:center; gap:.8rem; margin-bottom:.5rem; }
.topic-ico{
  width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:22px; flex:none; color:#fff;
}
.topic h3{ font-size:1.03rem; line-height:1.35; }
.topic .topic-sub{ color:var(--text-3); font-size:.8rem; }
.topic-meta{ display:flex; justify-content:space-between; font-size:.82rem; color:var(--text-2); margin:.55rem 0 .35rem; font-weight:600; }
.pbar{ height:8px; background:var(--surface-3); border-radius:99px; overflow:hidden; }
.pbar > i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, var(--primary), #8b5cf6); transition:width .6s ease; }
.pbar.green > i{ background:linear-gradient(90deg, #16a34a, #4ade80); }
.topic-actions{ margin-top:.85rem; display:flex; gap:.5rem; }
.topic-actions .btn{ padding:.4rem .8rem; font-size:.85rem; }

/* ============ Study layout ============ */
.study-layout{ display:grid; grid-template-columns:270px 1fr; gap:1.2rem; align-items:start; }
.study-layout.collapsed{ grid-template-columns:1fr; }
.study-layout.collapsed .sidebar{ display:none; }
.sidebar{ position:sticky; top:86px; display:flex; flex-direction:column; gap:.9rem; }
.side-top{ display:flex; justify-content:flex-end; padding:0 .15rem; }
.side-open-row{ margin-bottom:.9rem; }
.side-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:.85rem; box-shadow:var(--shadow-sm); }
.side-title{
  width:100%; display:flex; align-items:center; gap:.4rem; background:none; border:none; font:inherit;
  font-size:.78rem; text-transform:uppercase; letter-spacing:.8px; color:var(--text-3); font-weight:700;
  margin:.2rem .4rem .55rem; cursor:pointer; padding:.15rem 0; text-align:start;
}
.side-title .chev{ margin-inline-start:auto; transition:.2s; color:var(--text-3); font-size:15px; }
.side-card:not(.folded) .side-title .chev{ transform:rotate(90deg); }
html[dir="rtl"] .side-card:not(.folded) .side-title .chev{ transform:rotate(-90deg); }
.side-card.folded .side-items{ display:none; }
.side-card.folded .side-title{ margin-bottom:.2rem; }
.side-item{
  width:100%; text-align:start; border:1px solid transparent; background:transparent; color:var(--text-2);
  font:inherit; font-size:.9rem; font-weight:600; padding:.5rem .65rem; border-radius:10px; cursor:pointer;
  display:flex; align-items:center; gap:.55rem; transition:.12s;
}
.side-item:hover{ background:var(--surface-3); color:var(--text); }
.side-item.active{ background:var(--primary-soft); color:var(--primary-ink); border-color:color-mix(in srgb, var(--primary) 25%, transparent); }
.side-item .count{ margin-inline-start:auto; font-size:.74rem; background:var(--chip-bg); border-radius:99px; padding:.05rem .5rem; color:var(--text-3); }
.side-item.active .count{ background:color-mix(in srgb, var(--primary) 18%, var(--surface)); color:var(--primary-ink); }
.side-dot{ width:9px; height:9px; border-radius:3px; flex:none; }

/* ============ Question card ============ */
.q-list{ display:flex; flex-direction:column; gap:1.1rem; }
.q-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-sm); overflow:hidden; scroll-margin-top:90px; }
.q-head{ display:flex; align-items:center; gap:.55rem; padding:.85rem 1.2rem; border-bottom:1px solid var(--border); background:var(--surface-2); flex-wrap:wrap; }
.badge{ font-size:.72rem; font-weight:700; border-radius:99px; padding:.16rem .7rem; letter-spacing:.3px; white-space:nowrap; }
.badge-num{ background:var(--primary-soft); color:var(--primary-ink); }
.badge-sec{ background:var(--chip-bg); color:var(--text-2); border:1px solid var(--border); }
.badge-diff-concept{ background:#e0f2fe; color:#075985; }
.badge-diff-calc{ background:#fce7f3; color:#9d174d; }
html[data-theme="dark"] .badge-diff-concept{ background:#123a52; color:#7dd3fc; }
html[data-theme="dark"] .badge-diff-calc{ background:#4a1d3f; color:#f9a8d4; }
.badge-ok{ background:var(--ok-soft); color:var(--ok); }
.badge-bad{ background:var(--bad-soft); color:var(--bad); }
.q-head .spacer{ margin-inline-start:auto; }
.icon-btn{
  background:transparent; border:1px solid transparent; border-radius:9px; cursor:pointer; color:var(--text-3);
  width:34px; height:34px; display:grid; place-items:center; font-size:18px; transition:.12s;
}
.icon-btn:hover{ background:var(--surface-3); color:var(--accent); }
.icon-btn.on{ color:var(--accent); }
.icon-btn.on svg{ filter: drop-shadow(0 1px 3px rgba(245,158,11,.5)); }

.q-body{ padding:1.15rem 1.25rem 1.25rem; }
.q-text{ font-size:1.02rem; font-weight:600; margin-bottom:1rem; }
.opts{ display:flex; flex-direction:column; gap:.55rem; }
.opt{
  display:flex; align-items:flex-start; gap:.7rem; width:100%; text-align:start;
  background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px;
  padding:.7rem .9rem; font:inherit; font-size:.95rem; color:var(--text); cursor:pointer; transition:.14s;
  min-height:46px;
}
.opt:hover:not(:disabled){ border-color:var(--primary); background:var(--primary-soft); transform:translateX(2px); }
html[dir="rtl"] .opt:hover:not(:disabled){ transform:translateX(-2px); }
.opt:disabled{ cursor:default; }
.opt-key{
  flex:none; width:27px; height:27px; border-radius:8px; display:grid; place-items:center;
  background:var(--surface); border:1.5px solid var(--border-strong); font-weight:800; font-size:.83rem; color:var(--text-2);
}
.opt.correct{ border-color:var(--ok-border); background:var(--ok-soft); }
.opt.correct .opt-key{ background:var(--ok); border-color:var(--ok); color:#fff; }
.opt.picked{ border-color:var(--primary); background:var(--primary-soft); }
.opt.picked .opt-key{ background:var(--primary); border-color:var(--primary); color:#fff; }
.opt.wrong-pick{ border-color:var(--bad-border); background:var(--bad-soft); }
.opt.wrong-pick .opt-key{ background:var(--bad); border-color:var(--bad); color:#fff; }
.opt.dim{ opacity:.62; }
.opt-mark{ margin-inline-start:auto; font-size:18px; flex:none; }
.opt.correct .opt-mark{ color:var(--ok); }
.opt.wrong-pick .opt-mark{ color:var(--bad); }

.feedback{ margin-top:.9rem; border-radius:12px; padding:.75rem 1rem; font-weight:700; display:flex; align-items:center; gap:.6rem; font-size:.95rem; }
.feedback.good{ background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok-border); }
.feedback.poor{ background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad-border); }
.feedback.peek{ background:var(--primary-soft); color:var(--primary-ink); border:1px solid color-mix(in srgb, var(--primary) 35%, transparent); }
.feedback .ico{ font-size:20px; }

/* question action toolbar */
.q-toolbar{ display:flex; gap:.55rem; margin-top:.95rem; flex-wrap:wrap; }
.q-toolbar .btn{ padding:.42rem .9rem; font-size:.86rem; }
.badge-peek{ background:var(--accent-soft); color:var(--accent); }
.q-card.flash{ animation: cardFlash 1.3s ease; }
@keyframes cardFlash{
  0%{ box-shadow: 0 0 0 5px var(--ring); border-color: var(--primary); }
  100%{ box-shadow: var(--shadow-sm); }
}

/* ============ Explanation panel ============ */
.expl{ margin-top:1rem; border:1px solid var(--border); border-radius:14px; overflow:hidden; animation:fadeUp .3s ease; }
.expl-head{
  display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem; cursor:pointer;
  background:var(--surface-2); font-weight:700; font-size:.93rem; color:var(--text); width:100%; border:none; font-family:inherit; text-align:start;
}
.expl-head .ico{ color:var(--primary); font-size:19px; }
.expl-head .chev{ margin-inline-start:auto; transition:.2s; color:var(--text-3); }
.expl.open .expl-head .chev{ transform:rotate(90deg); }
html[dir="rtl"] .expl.open .expl-head .chev{ transform:rotate(-90deg); }
.expl-body{ padding:1rem 1.1rem 1.15rem; display:none; border-top:1px solid var(--border); }
.expl.open .expl-body{ display:block; }
.expl-sec{ margin-bottom:1rem; }
.expl-sec:last-child{ margin-bottom:0; }
.expl-label{
  display:inline-flex; align-items:center; gap:.4rem;
  font-size:.74rem; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--primary-ink);
  background:var(--primary-soft); border-radius:99px; padding:.18rem .75rem; margin-bottom:.5rem;
}
.expl-label .ico{ font-size:14px; }
.formula-box{
  font-family:var(--mono); font-size:.95rem; direction:ltr; text-align:left; unicode-bidi:embed;
  background:var(--surface-3); border:1px dashed var(--border-strong); border-radius:10px;
  padding:.65rem .9rem; color:var(--text); overflow-x:auto; line-height:1.8;
}
html[lang="ar"] .formula-box{
  font-family:var(--font-ar); direction:rtl; text-align:right; unicode-bidi:plaintext;
}
.steps{ counter-reset:step; display:flex; flex-direction:column; gap:.45rem; }
.step{ display:flex; gap:.65rem; align-items:flex-start; font-size:.94rem; }
.step::before{
  counter-increment:step; content:counter(step);
  flex:none; width:23px; height:23px; margin-top:.15rem; border-radius:50%;
  background:var(--primary); color:#fff; font-size:.75rem; font-weight:800; display:grid; place-items:center;
}
.step-txt{ unicode-bidi:plaintext; }
.step-math{ font-family:var(--mono); direction:ltr; unicode-bidi:embed; font-size:.9rem; background:var(--surface-3); border-radius:6px; padding:.1rem .4rem; display:inline-block; }
.why-txt{ font-size:.95rem; color:var(--text); }
.wrong-list{ display:flex; flex-direction:column; gap:.5rem; }
.wrong-item{ display:flex; gap:.6rem; align-items:flex-start; font-size:.9rem; color:var(--text-2); background:var(--surface-2); border-radius:10px; padding:.55rem .8rem; border:1px solid var(--border); }
.wrong-item .k{ flex:none; font-weight:800; color:var(--bad); }
.note-box{
  background:var(--warn-soft); border:1px solid var(--warn-border); border-radius:10px;
  padding:.7rem .95rem; font-size:.9rem; display:flex; gap:.6rem; align-items:flex-start; color:var(--text);
}
.note-box .ico{ color:var(--accent); font-size:18px; flex:none; margin-top:.15rem; }

/* ============ Exam ============ */
.exam-setup{ max-width:760px; margin:0 auto; }
.setup-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:.7rem; margin:.8rem 0 1.2rem; }
.pick{
  border:1.5px solid var(--border); background:var(--surface-2); border-radius:12px; padding:.8rem .6rem;
  cursor:pointer; font:inherit; text-align:center; transition:.14s; color:var(--text);
}
.pick b{ display:block; font-size:1.15rem; }
.pick span{ font-size:.78rem; color:var(--text-3); }
.pick:hover{ border-color:var(--primary); }
.pick.sel{ border-color:var(--primary); background:var(--primary-soft); box-shadow:0 0 0 3px var(--ring); }
.sec-picks{ display:flex; flex-wrap:wrap; gap:.5rem; margin:.6rem 0 1.3rem; }
.sec-pick{
  border:1.5px solid var(--border); background:var(--surface-2); border-radius:99px; padding:.4rem .95rem;
  cursor:pointer; font:inherit; font-size:.86rem; font-weight:600; color:var(--text-2); transition:.14s; display:inline-flex; gap:.45rem; align-items:center;
}
.sec-pick .tick{ font-size:14px; color:var(--ok); display:none; }
.sec-pick.sel{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-ink); }
.sec-pick.sel .tick{ display:inline; }

.exam-top{
  position:sticky; top:70px; z-index:20; background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(8px); border:1px solid var(--border); border-radius:14px; padding:.65rem .95rem;
  display:flex; align-items:center; gap:.9rem; box-shadow:var(--shadow-sm); margin-bottom:1rem; flex-wrap:wrap;
}
.exam-timer{ display:flex; align-items:center; gap:.45rem; font-weight:800; font-variant-numeric:tabular-nums; font-size:1.02rem; color:var(--primary-ink); }
.exam-timer .ico{ font-size:19px; }
.exam-progress-txt{ font-size:.85rem; color:var(--text-3); font-weight:600; }
.exam-top .spacer{ margin-inline-start:auto; }
.mini-pbar{ flex:1 1 120px; min-width:100px; }

.exam-nav-grid{ display:flex; flex-wrap:wrap; gap:.35rem; margin:0 0 1.1rem; }
.nav-chip{
  width:38px; height:38px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface);
  color:var(--text-2); font:inherit; font-weight:700; font-size:.85rem; cursor:pointer; transition:.12s;
}
.nav-chip:hover{ border-color:var(--primary); }
.nav-chip.answered{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary-ink); }
.nav-chip.current{ outline:3px solid var(--ring); }

.exam-actions{ display:flex; gap:.6rem; margin-top:1.2rem; flex-wrap:wrap; }
.exam-actions .spacer{ margin-inline-start:auto; }

/* ============ Results ============ */
.result-hero{ text-align:center; padding:2rem 1rem 1.4rem; }
.result-ring{ width:180px; height:180px; margin:0 auto 1rem; position:relative; }
.result-ring svg{ transform:rotate(-90deg); }
.result-ring .ring-track{ stroke:var(--surface-3); }
.result-ring .ring-val{ stroke:var(--primary); transition:stroke-dashoffset 1s ease; }
.result-ring.pass .ring-val{ stroke:var(--ok); }
.result-ring.fail .ring-val{ stroke:var(--bad); }
.result-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.result-center b{ font-size:2.4rem; line-height:1; }
.result-center span{ color:var(--text-3); font-size:.85rem; font-weight:600; }
.result-title{ font-size:1.3rem; margin-bottom:.3rem; }
.result-sub{ color:var(--text-2); }
.result-stats{ display:flex; gap:1.4rem; justify-content:center; margin-top:1.2rem; flex-wrap:wrap; }
.rstat b{ font-size:1.25rem; display:block; }
.rstat span{ font-size:.78rem; color:var(--text-3); font-weight:600; }
.rstat.ok b{ color:var(--ok); } .rstat.bad b{ color:var(--bad); } .rstat.gold b{ color:var(--accent); }
.result-actions{ display:flex; gap:.6rem; justify-content:center; margin-top:1.4rem; flex-wrap:wrap; }

.review-head{ margin:2rem 0 1rem; display:flex; align-items:center; gap:.7rem; }
.review-head h2{ font-size:1.2rem; }

/* ============ Formula sheet ============ */
.fx-group{ margin-bottom:1.6rem; }
.fx-group > h2{
  font-size:1.1rem; padding:.8rem 1.1rem; border-radius:14px 14px 0 0; color:#fff;
  background:linear-gradient(120deg, var(--fx-c1,#3b4fd8), var(--fx-c2,#8b5cf6));
  display:flex; align-items:center; gap:.6rem;
}
.fx-group > h2 .ico{ font-size:20px; }
.fx-rows{ border:1px solid var(--border); border-top:none; border-radius:0 0 14px 14px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow-sm); }
.fx-row{ display:grid; grid-template-columns:minmax(180px, 1fr) minmax(220px, 1.4fr); gap:1rem; padding:.75rem 1.1rem; border-bottom:1px solid var(--border); align-items:center; }
.fx-row:last-child{ border-bottom:none; }
.fx-row:nth-child(even){ background:var(--surface-2); }
.fx-name{ font-weight:700; font-size:.92rem; }
.fx-name small{ display:block; color:var(--text-3); font-weight:500; font-size:.78rem; }
.fx-eq{ font-family:var(--mono); direction:ltr; text-align:left; unicode-bidi:embed; font-size:.92rem; color:var(--primary-ink); background:var(--surface-3); border-radius:8px; padding:.4rem .7rem; overflow-x:auto; }

/* ============ Onboarding (name registration) ============ */
.onb-overlay{
  position:fixed; inset:0; z-index:100; padding:1rem;
  background:rgba(8,12,24,.6); backdrop-filter:blur(5px);
  display:grid; place-items:center; animation:fadeUp .25s ease;
}
.onb-card{ max-width:430px; width:100%; padding:1.9rem 1.6rem; text-align:center;
  display:flex; flex-direction:column; gap:.75rem; align-items:center; }
.onb-ico{ width:58px; height:58px; font-size:32px; border-radius:16px; }
.onb-card h2{ font-size:1.35rem; }
.onb-card p{ font-size:.92rem; max-width:34ch; }
.txt-in{
  width:100%; padding:.72rem .95rem; border-radius:11px; border:1.5px solid var(--border-strong);
  background:var(--surface-2); color:var(--text); font:inherit; font-size:1rem; text-align:center;
}
.txt-in:focus{ outline:3px solid var(--ring); border-color:var(--primary); }
.onb-err{ color:var(--bad); font-size:.85rem; min-height:1.2em; margin:0; font-weight:600; }
.onb-btn{ width:100%; justify-content:center; padding:.7rem 1rem; font-size:1rem; }

/* ============ Grades view ============ */
.grade-top{ display:grid; grid-template-columns:minmax(230px, 320px) 1fr; gap:1rem; align-items:stretch; }
.grade-main{ padding:1.4rem 1.2rem; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; }
.grade-letter{
  width:74px; height:74px; border-radius:20px; display:grid; place-items:center;
  font-size:2.2rem; font-weight:800; color:#fff; background:linear-gradient(135deg, var(--primary), #8b5cf6);
  box-shadow:var(--shadow-sm);
}
.grade-letter.gA{ background:linear-gradient(135deg,#16a34a,#4ade80); }
.grade-letter.gB{ background:linear-gradient(135deg,#0d9488,#2dd4bf); }
.grade-letter.gC{ background:linear-gradient(135deg,#d97706,#fbbf24); }
.grade-letter.gD{ background:linear-gradient(135deg,#ea580c,#fb923c); }
.grade-letter.gF{ background:linear-gradient(135deg,#dc2626,#f87171); }
.grade-pct{ font-size:2rem; font-weight:800; line-height:1.1; }
.grade-sub{ color:var(--text-3); font-size:.85rem; font-weight:600; }
.grade-parts{ display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; margin-top:.3rem; }
.gpart{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:.45rem .8rem; font-size:.82rem; }
.gpart b{ display:block; font-size:1.05rem; }
.grade-side{ padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:.65rem; }
.prof-row{ display:flex; align-items:center; gap:.6rem; font-size:.92rem; }
.prof-row .ico{ color:var(--primary); font-size:17px; flex:none; }
.prof-row b{ margin-inline-start:auto; font-variant-numeric:tabular-nums; }
.prof-name{ font-size:1.12rem; font-weight:800; display:flex; align-items:center; gap:.5rem; }
.prof-name .icon-btn{ width:30px; height:30px; font-size:15px; }
.tbl-wrap{ overflow-x:auto; }
.chart-wrap{ overflow-x:auto; padding:.4rem .2rem .2rem; }
.chart-wrap svg{ min-width:520px; width:100%; height:auto; display:block; }
.chart-line{ fill:none; stroke:var(--primary); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.chart-dot{ fill:var(--primary); stroke:var(--surface); stroke-width:2.5; }
.chart-pass{ stroke:var(--ok); stroke-dasharray:6 5; stroke-width:1.5; opacity:.7; }
.chart-grid{ stroke:var(--border); stroke-width:1; }
.chart-lbl{ fill:var(--text-3); font-size:11px; font-weight:600; }
.chart-val{ fill:var(--primary-ink); font-size:11px; font-weight:800; }

/* ============ Misc ============ */
.empty{ text-align:center; padding:3rem 1rem; color:var(--text-3); }
.empty .ico{ font-size:44px; display:block; margin-bottom:.6rem; opacity:.5; }
.toast{
  position:fixed; bottom:22px; inset-inline-start:50%; transform:translateX(-50%) translateY(80px);
  background:var(--text); color:var(--bg); border-radius:12px; padding:.65rem 1.2rem; font-weight:700; font-size:.9rem;
  opacity:0; pointer-events:none; transition:.3s; z-index:99; box-shadow:var(--shadow);
}
html[dir="rtl"] .toast{ transform:translateX(50%) translateY(80px); }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
html[dir="rtl"] .toast.show{ transform:translateX(50%) translateY(0); }

.hist-table{ width:100%; border-collapse:collapse; font-size:.88rem; }
.hist-table th{ text-align:start; color:var(--text-3); font-size:.75rem; text-transform:uppercase; letter-spacing:.5px; padding:.45rem .6rem; border-bottom:1px solid var(--border); }
.hist-table td{ padding:.5rem .6rem; border-bottom:1px solid var(--border); }
.hist-table tr:last-child td{ border-bottom:none; }

.footer{ border-top:1px solid var(--border); margin-top:2rem; background:var(--surface); }
.footer-in{ max-width:1180px; margin:0 auto; padding:1.1rem; text-align:center; color:var(--text-3); font-size:.85rem; }
.footer-note{ font-size:.78rem; margin-top:.25rem; }

/* ============ Responsive ============ */
@media (max-width: 920px){
  .study-layout{ grid-template-columns:1fr; }
  .sidebar{ position:static; flex-direction:row; overflow-x:auto; padding-bottom:.3rem; }
  .side-card{ min-width:250px; }
  .brand-txt small{ display:none; }
}
@media (max-width: 720px){
  .topbar-in{ flex-wrap:wrap; padding:.5rem .8rem; }
  .mainnav{ order:3; width:100%; margin-inline-start:0; overflow-x:auto; }
  .nav-btn span.lbl{ display:none; }
  .nav-btn{ padding:.5rem .7rem; }
  .hero{ padding:1.3rem; }
  .ring-wrap{ width:110px; height:110px; }
  .fx-row{ grid-template-columns:1fr; gap:.4rem; }
  .app{ padding:1rem .7rem 2.5rem; }
}

/* ---- phones ---- */
@media (max-width: 560px){
  .topbar-in{ gap:.5rem; padding:.45rem .6rem; }
  .brand-ico{ width:36px; height:36px; font-size:20px; border-radius:10px; }
  .brand-txt strong{ font-size:.92rem; }
  .icon-only, .lang-btn{ padding:.55rem .6rem; }
  .mainnav{ gap:.2rem; }
  .nav-btn{ padding:.6rem .75rem; min-height:42px; }
  .hero{ padding:1.05rem; gap:1rem; }
  .hero h1{ font-size:1.3rem; }
  .hero p{ font-size:.9rem; }
  .hero-ring{ margin:0 auto; }
  .ring-wrap{ width:118px; height:118px; }
  .ring-label b{ font-size:1.4rem; }
  .hero-actions .btn{ flex:1 1 auto; justify-content:center; }
  .stats{ grid-template-columns:repeat(2, 1fr); gap:.6rem; }
  .stat{ padding:.75rem .8rem; gap:.6rem; }
  .stat b{ font-size:1.1rem; }
  .stat-ico{ width:36px; height:36px; font-size:18px; }
  .topics{ grid-template-columns:1fr; }
  .study-layout{ gap:.9rem; }
  .sidebar{ gap:.6rem; }
  .side-card{ min-width:215px; padding:.7rem; }
  .q-head{ padding:.65rem .8rem; gap:.4rem; }
  .q-card{ scroll-margin-top:104px; }
  .q-body{ padding:.9rem .85rem 1.05rem; }
  .q-text{ font-size:.97rem; }
  .opt{ padding:.62rem .7rem; font-size:.9rem; gap:.55rem; }
  .opt-key{ width:25px; height:25px; font-size:.78rem; }
  .q-toolbar{ gap:.45rem; }
  .q-toolbar .btn{ flex:1 1 45%; justify-content:center; padding:.5rem .6rem; }
  .feedback{ font-size:.88rem; padding:.65rem .8rem; }
  .expl-body{ padding:.85rem .85rem 1rem; }
  .formula-box{ font-size:.85rem; }
  .step{ font-size:.9rem; }
  .exam-top{ top:98px; padding:.5rem .65rem; gap:.5rem; }
  .exam-top .btn{ padding:.45rem .7rem; font-size:.85rem; }
  .nav-chip{ width:33px; height:33px; font-size:.78rem; border-radius:8px; }
  .exam-actions .btn{ flex:1 1 auto; justify-content:center; }
  .result-ring{ width:148px; height:148px; }
  .result-center b{ font-size:1.9rem; }
  .result-stats{ gap:.9rem; }
  .grade-top{ grid-template-columns:1fr; }
  .grade-main{ padding:1.1rem; }
  .grade-pct{ font-size:1.7rem; }
  .grade-letter{ width:62px; height:62px; font-size:1.8rem; border-radius:16px; }
  .grade-side{ padding:.9rem 1rem; }
  .onb-card{ padding:1.5rem 1.2rem; }
  .btn{ padding:.5rem .8rem; }
  .icon-btn{ width:38px; height:38px; }
  .footer-in{ padding:.9rem .7rem; }
}

</style>

<script>
/* ============================================================
   App logic — dashboard, study, mock exam, results, formulas
   ============================================================ */
"use strict";
(function(){

const I18N = window.I18N, QB = window.QB, SECS = I18N.sectionOrder, LETTERS = ["A","B","C","D"];
const TOTAL = QB.length;

/* Pre-configured class deployment (Apps Script Web App). Replace here if you redeploy. */
const DEFAULT_SYNC_URL = "https://script.google.com/macros/s/AKfycbxAfHSQKPGd0GONgNCBUXSHKLEAGYB_9LGG-v6-tlXNKjrKkc2aGz5mqwIV66NlpaY/exec";

/* ---------------- persistence ---------------- */
const LS_KEY = "cfin.midterm.v1";
let memFallback = null, saved = null;
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch(e){ saved = null; }
saved = saved || {};
const P = {
  lang:  saved.lang === "ar" ? "ar" : "en",
  theme: saved.theme === "dark" ? "dark" : "light",
  name:  typeof saved.name === "string" ? saved.name : "",
  answers: (saved.answers && typeof saved.answers === "object") ? saved.answers : {},
  bookmarks: Array.isArray(saved.bookmarks) ? saved.bookmarks : [],
  peeked: Array.isArray(saved.peeked) ? saved.peeked : [],
  shuffleOpts: saved.shuffleOpts === true,
  order: (saved.order && typeof saved.order === "object") ? saved.order : {},
  side: (saved.side && typeof saved.side === "object") ? saved.side : { collapsed:false, topics:true, filters:true },
  exams: Array.isArray(saved.exams) ? saved.exams : [],
  visits: typeof saved.visits === "number" ? saved.visits : 0,
  firstVisit: typeof saved.firstVisit === "number" ? saved.firstVisit : null,
  sessions: Array.isArray(saved.sessions) ? saved.sessions : [],
  sid: typeof saved.sid === "string" && saved.sid ? saved.sid : "",
  syncUrl: typeof saved.syncUrl === "string" ? saved.syncUrl : DEFAULT_SYNC_URL,
  syncAdmin: saved.syncAdmin === true,
  lifePrac: (saved.lifePrac && typeof saved.lifePrac === "object") ? saved.lifePrac : { c:0, s:0, topics:{} },
  lastSync: typeof saved.lastSync === "number" ? saved.lastSync : 0,
  queue: Array.isArray(saved.queue) ? saved.queue : [],
  dirty: saved.dirty === true
};
function save(){ const s = JSON.stringify(P); try{ localStorage.setItem(LS_KEY, s); }catch(e){ memFallback = s; } }
save();

/* ---------------- state ---------------- */
const state = {
  view: "dashboard",
  studySec: "all",
  studyFilter: "all",
  examSetup: { count: "all", secs: new Set(SECS), shuffle: false },
  exam: null,
  lastResult: null
};
const explOverride = {};   // qid -> bool (open/closed)

/* ---------------- helpers ---------------- */
const $id = id => document.getElementById(id);
const t = k => (I18N.ui[P.lang][k] !== undefined ? I18N.ui[P.lang][k] : (I18N.ui.en[k] !== undefined ? I18N.ui.en[k] : k));
const L = () => P.lang;
const qd = q => q[L()];
const secMeta = () => I18N.sections[L()];
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function isPerm(a){ return Array.isArray(a) && a.length === 4 && [0,1,2,3].every(i => a.indexOf(i) !== -1); }
/* display order of options for a question: stored permutation, lazily created when global shuffle is on */
function getOrder(qid){
  if(isPerm(P.order[qid])) return P.order[qid];
  if(P.shuffleOpts){ const p = shuffle([0,1,2,3]); P.order[qid] = p; save(); return p; }
  return [0,1,2,3];
}
function fmtTime(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  return h>0 ? h+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0") : m+":"+String(ss).padStart(2,"0"); }
const bySec = sec => QB.filter(q => q.sec === sec);
const qIndex = id => QB.findIndex(q => q.id === id);
function toast(msg){ const el=$id("toast"); if(!el)return; el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2400); }

function statAll(){
  const selIds = Object.keys(P.answers);
  const correct = selIds.filter(id => P.answers[id].ok).length;
  const seen = new Set(selIds); P.peeked.forEach(id => seen.add(id));
  return { answered: seen.size, selections: selIds.length, correct, wrong: selIds.length - correct,
           accuracy: selIds.length ? Math.round(correct/selIds.length*100) : 0,
           progress: Math.round(seen.size/TOTAL*100) };
}
function statSec(sec){
  const qs = bySec(sec);
  const ans = qs.filter(q => P.answers[q.id]);
  const ok = ans.filter(q => P.answers[q.id].ok);
  const seen = qs.filter(q => P.answers[q.id] || P.peeked.includes(q.id));
  return { total: qs.length, answered: seen.length, correct: ok.length, selections: ans.length };
}
/* grade model: overall = 50% practice accuracy + 50% mock-exam average */
function letter(p){ return p >= 90 ? "A" : p >= 80 ? "B" : p >= 70 ? "C" : p >= 60 ? "D" : "F"; }
/* cumulative practice stats (survive study-session wipes) merged with the live session */
function pracMerged(){
  const st = statAll(); const topics = {};
  SECS.forEach(sec => {
    const s = statSec(sec); const lf = (P.lifePrac.topics || {})[sec] || [0,0];
    topics[sec] = [lf[0]+s.correct, lf[1]+s.selections];
  });
  return { correct:(P.lifePrac.c||0)+st.correct, selections:(P.lifePrac.s||0)+st.selections, topics };
}
/* study answers are ephemeral: fold them into lifetime stats, then erase them */
function clearStudyTrace(){
  const st = statAll();
  if(st.selections){
    P.lifePrac.c = (P.lifePrac.c||0) + st.correct;
    P.lifePrac.s = (P.lifePrac.s||0) + st.selections;
    P.lifePrac.topics = P.lifePrac.topics || {};
    SECS.forEach(sec => { const s = statSec(sec); const t0 = P.lifePrac.topics[sec] || [0,0];
      P.lifePrac.topics[sec] = [t0[0]+s.correct, t0[1]+s.selections]; });
  }
  P.answers = {}; P.peeked = []; P.order = {};
  Object.keys(explOverride).forEach(k => delete explOverride[k]);
  save();
}
function computeGrade(){
  const pm = pracMerged();
  const pracAcc = pm.selections ? Math.round(pm.correct / pm.selections * 100) : null;
  const examAvg = P.exams.length ? Math.round(P.exams.reduce((a,r) => a + r.pct, 0) / P.exams.length) : null;
  let overall = null;
  if(pracAcc !== null && examAvg !== null) overall = Math.round(pracAcc * 0.5 + examAvg * 0.5);
  else if(pracAcc !== null) overall = pracAcc;
  else if(examAvg !== null) overall = examAvg;
  return { pracAcc, examAvg, overall };
}
function fmtDate(ts){ return new Date(ts).toLocaleString(P.lang === "ar" ? "ar-EG" : "en-GB", {dateStyle:"medium", timeStyle:"short"}); }
function totalSecs(){ touchSession(); return P.sessions.reduce((a,s) => a + (s.secs||0), 0); }

function ringSVG(pct, size, stroke, cls){
  const r = (size - stroke)/2, c = 2*Math.PI*r, off = c*(1 - Math.min(1, Math.max(0, pct)));
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" class="'+(cls||"")+'">'
    + '<circle class="ring-track" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="'+stroke+'"/>'
    + '<circle class="ring-val" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="'+stroke+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'
    + '</svg>';
}

/* ---------------- chrome (header/nav/lang/theme) ---------------- */
function applyChrome(){
  const de = document.documentElement;
  de.lang = P.lang; de.dir = P.lang === "ar" ? "rtl" : "ltr"; de.dataset.theme = P.theme;
  $id("themeIco").setAttribute("href", P.theme === "dark" ? "#i-sun" : "#i-moon");
  $id("langBtnTxt").textContent = t("langSwitch");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  renderNav();
}
const NAVVIEWS = { examSetup:"exam", examRun:"exam", results:"exam" };
function renderNav(){
  const cur = NAVVIEWS[state.view] || state.view;
  const items = [["dashboard","i-home","navDashboard"],["study","i-book","navStudy"],["exam","i-exam","navExam"],["grades","i-chart","navGrades"],["formulas","i-fx","navFormulas"]];
  $id("mainnav").innerHTML = items.map(it =>
    '<button class="nav-btn '+(cur===it[0]?"active":"")+'" data-nav="'+it[0]+'">'
    + '<svg class="ico"><use href="#'+it[1]+'"/></svg><span class="lbl">'+t(it[2])+'</span></button>').join("");
}

function go(view){
  if(state.view === "examRun" && view !== "examRun" && state.exam && !state.exam.done){
    if(!confirm(t("examLeave"))) return;
    stopTimer(); state.exam = null;
  }
  if(view === "exam"){ view = (state.exam && !state.exam.done) ? "examRun" : "examSetup"; }
  if(state.view === "study" && view !== "study") clearStudyTrace();   /* training answers are ephemeral */
  state.view = view; render(); window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------------- views ---------------- */
const VIEWS = {};

/* ===== Dashboard ===== */
VIEWS.dashboard = function(){
  const st = statAll();
  const g = computeGrade();
  let h = '<div class="view">';
  h += '<section class="hero"><div class="hero-main">'
     + '<h1>'+esc(t("heroTitle"))+'</h1>'
     + (P.name ? '<p style="font-weight:700;color:#ffe9a8;margin-bottom:.2rem">👋 '+esc(t("welcomeBack").replace("{name}", P.name))+'</p>' : '')
     + '<p>'+esc(t("heroText"))+'</p>'
     + '<div class="hero-chips"><span class="chip">📝 '+esc(t("heroChip1"))+'</span><span class="chip">🗂️ '+esc(t("heroChip2"))+'</span>'

     + (P.name ? '<button class="chip" data-action="edit-name" title="'+esc(t("editName"))+'" style="cursor:pointer">👤 '+esc(P.name)+' ✎</button>' : '')
     + (g.overall !== null ? '<span class="chip">🎯 '+esc(t("grOverall"))+': '+g.overall+'% ('+letter(g.overall)+')</span>' : '')
     + '</div>'

     + '</section>';

  h += '<div class="stats">'
     + statCard("blue","i-check", st.answered+" / "+TOTAL, t("statAnswered"))
     + statCard("green","i-target", st.accuracy+"%", t("statAccuracy"))
     + statCard("red","i-x", st.wrong, t("statWrong"))
     + statCard("gold","i-star", P.bookmarks.length, t("statBookmarks"))
     + '</div>';

  h += '<div style="display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:.4rem 0 1.2rem">'
     + '<button class="btn '+(P.shuffleOpts?"btn-primary":"")+'" data-action="toggle-shuffle"><svg class="ico"><use href="#i-shuffle"/></svg>'+esc(t("shuffleOpts"))+' — <b>'+esc(t(P.shuffleOpts?"optOn":"optOff"))+'</b></button>'

  const wrongIds = QB.filter(q => P.answers[q.id] && !P.answers[q.id].ok);
  if(wrongIds.length || P.bookmarks.length){
    h += '<div class="sec-head"><h2>'+esc(t("resumeTitle"))+'</h2></div>'

       + '<span class="muted" style="flex:1 1 260px">'+esc(t("resumeText"))+'</span>'
       + (wrongIds.length ? '<button class="btn btn-ok" data-action="retry-wrong"><svg class="ico"><use href="#i-x"/></svg>'+esc(t("btnResumeWrong"))+' ('+wrongIds.length+')</button>' : '')

       + '</div>';
  }

  h += '<div class="sec-head"><h2>'+esc(t("topicsTitle"))+'</h2><span class="muted">'+esc(t("topicsSub"))+'</span></div><div class="grid topics">';
  SECS.forEach(sec => {
    const s = statSec(sec), m = secMeta()[sec], col = I18N.sectionColors[sec];
    const pct = Math.round(s.answered/s.total*100);
    h += '<div class="topic">'
       + '<div class="topic-top"><span class="topic-ico" style="background:'+col+'">'+I18N.sectionIcons[sec]+'</span>'
       + '<span><h3>'+esc(m.title)+'</h3><span class="topic-sub">'+esc(m.sub)+'</span></span></div>'
       + '<div class="topic-meta"><span>'+s.answered+' / '+s.total+' · ✓ '+s.correct+'</span><span>'+pct+'%</span></div>'
       + '<div class="pbar '+(pct===100?"green":"")+'"><i style="width:'+pct+'%"></i></div>'
       + '<div class="topic-actions">'
       + '<button class="btn btn-primary" data-action="study-topic" data-sec="'+sec+'"><svg class="ico"><use href="#i-book"/></svg>'+esc(t("btnStudyTopic"))+'</button>'
       + '<button class="btn" data-action="quiz-topic" data-sec="'+sec+'"><svg class="ico"><use href="#i-target"/></svg>'+esc(t("btnExamTopic"))+'</button>'
       + '</div></div>';
  });
  h += '</div>';

  h += '<div class="sec-head"><h2>'+esc(t("histTitle"))+'</h2></div><div class="card" style="padding:.6rem 1rem">';
  if(P.exams.length){
    h += '<table class="hist-table"><thead><tr><th>'+esc(t("histDate"))+'</th><th>'+esc(t("histScore"))+'</th><th>'+esc(t("histQ"))+'</th><th>'+esc(t("histPct"))+'</th><th>'+esc(t("resTime"))+'</th></tr></thead><tbody>';

  if(P.syncAdmin){

function statCard(color, ico, val, label){

       + '<span><b>'+val+'</b><span>'+esc(label)+'</span></span></div>';

/* ===== Study ===== */
function studyPool(){
  let qs = state.studySec === "all" ? QB.slice() : bySec(state.studySec);
  const f = state.studyFilter;
  if(f === "unanswered") qs = qs.filter(q => !P.answers[q.id] && !P.peeked.includes(q.id));
  else if(f === "wrong") qs = qs.filter(q => P.answers[q.id] && !P.answers[q.id].ok);
  else if(f === "bookmarked") qs = qs.filter(q => P.bookmarks.includes(q.id));
  return qs;
}

VIEWS.study = function(){

       + '<div class="side-items">';

        + '<svg class="ico" style="font-size:15px"><use href="#'+(f[0]==="wrong"?"i-x":f[0]==="bookmarked"?"i-star":f[0]==="unanswered"?"i-info":"i-book")+'"/></svg>'

/* ===== Question card (shared) ===== */
function cardHTML(q, o){
  o = o || {};
  const d = qd(q), m = secMeta()[q.sec], color = I18N.sectionColors[q.sec];
  let sel = undefined, revealed = false, ok = false, peeked = false;
  const ansRec = P.answers[q.id];
  if(ansRec){ sel = ansRec.sel; revealed = true; ok = ansRec.ok; }
  else if(P.peeked.includes(q.id)){ peeked = true; revealed = true; }
  if(o.mode === "exam"){   /* live exam: never leak or lock from study answers/peeks */
    sel = (state.exam && state.exam.picks[q.id] !== undefined) ? state.exam.picks[q.id] : undefined;
    revealed = false; peeked = false; ok = false;
  }
  if(o.mode === "review"){ sel = o.sel; revealed = true; ok = (sel === q.correct); peeked = false; }

  const bm = P.bookmarks.includes(q.id);
  let h = '<article class="card q-card" id="card-'+q.id+'" data-qid="'+q.id+'">';
  h += '<div class="q-head">'
     + '<span class="badge badge-num">Q'+(qIndex(q.id)+1)+'</span>'
     + '<span class="badge badge-sec"><span class="side-dot" style="background:'+color+';display:inline-block;vertical-align:middle;margin-inline-end:5px"></span>'+esc(m.title)+'</span>'
     + '<span class="badge badge-diff-'+q.diff+'">'+esc(t("diffLabels")[q.diff])+'</span>'
     + (peeked ? '<span class="badge badge-peek"><svg class="ico" style="font-size:12px;vertical-align:-1px"><use href="#i-eye"/></svg> '+esc(t("badgePeek"))+'</span>' : '')
     + (revealed && !peeked ? '<span class="badge '+(ok?"badge-ok":"badge-bad")+'">'+(ok?"✓ "+LETTERS[q.correct]:"✗ "+LETTERS[q.correct])+'</span>' : '')
     + '<span class="spacer"></span>'
     + (o.mode === "study" && revealed ? '<button class="icon-btn" data-action="retry" data-qid="'+q.id+'" title="Retry"><svg class="ico"><use href="#i-refresh"/></svg></button>' : '')
     + '<button class="icon-btn '+(bm?"on":"")+'" data-action="bm" data-qid="'+q.id+'" title="'+esc(t(bm?"bookmarked":"bookmark"))+'"><svg class="ico"><use href="#'+(bm?"i-star":"i-star-o")+'"/></svg></button>'
     + '</div>';

  h += '<div class="q-body"><p class="q-text u-bidi">'+nl2br(d.q)+'</p><div class="opts">';
  const perm = getOrder(q.id);
  perm.forEach((orig, p) => {
    let cls = "opt", mark = "";
    if(revealed){
      if(orig === q.correct){ cls += " correct"; mark = '<svg class="ico opt-mark"><use href="#i-check"/></svg>'; }
      else if(orig === sel){ cls += " wrong-pick"; mark = '<svg class="ico opt-mark"><use href="#i-x"/></svg>'; }
      else cls += " dim";
    } else if(sel === orig){ cls += " picked"; }  /* exam: neutral highlight of the pick */
    const dis = (revealed && o.mode !== "study") ? "disabled" : "";
    const act = o.mode === "exam" ? "exam-pick" : "pick";
    h += '<button class="'+cls+'" data-action="'+act+'" data-qid="'+q.id+'" data-i="'+orig+'" '+dis+'>'
       + '<span class="opt-key">'+LETTERS[p]+'</span><span class="u-bidi">'+esc(d.o[orig])+'</span>'+mark+'</button>';
  });
  h += '</div>';

  /* action toolbar: show-answer + explanation + next (not during a live exam) */
  if(o.mode !== "exam"){
    h += '<div class="q-toolbar">';
    if(!revealed) h += '<button class="btn btn-ghost" data-action="peek" data-qid="'+q.id+'"><svg class="ico"><use href="#i-eye"/></svg>'+esc(t("btnShowAnswer"))+'</button>';
    h += '<button class="btn btn-ghost" data-action="toggle-expl" data-qid="'+q.id+'"><svg class="ico"><use href="#i-bulb"/></svg>'+esc(t("btnExpl"))+'</button>';
    if(o.mode === "study" && revealed) h += '<button class="btn btn-primary" data-action="next-q" data-qid="'+q.id+'">'+esc(t("btnNext"))+'<svg class="ico"><use href="#i-arrow-r"/></svg></button>';
    h += '</div>';
  }

  if(o.mode === "review" && sel === undefined){
    h += '<div class="feedback poor"><svg class="ico"><use href="#i-x"/></svg>'+esc(t("resNoPick"))+' — '+esc(t("resCorrectIs"))+' '+LETTERS[q.correct]+'</div>';
  } else if(peeked){
    h += '<div class="feedback peek"><svg class="ico"><use href="#i-eye"/></svg>'
       + esc(t("fbPeek").replace("{L}", LETTERS[q.correct] + " — " + d.o[q.correct])) + '</div>';
  } else if(revealed){
    h += '<div class="feedback '+(ok?"good":"poor")+'"><svg class="ico"><use href="#'+(ok?"i-check":"i-x")+'"/></svg>'
       + esc(ok ? t("fbCorrect") : t("fbWrong").replace("{L}", LETTERS[q.correct] + " — " + d.o[q.correct]))
       + '</div>';
  }
  const defaultOpen = o.mode === "review" ? (sel === undefined || sel !== q.correct) : !!ansRec;
  h += explHTML(q, defaultOpen);
  h += '</div></article>';
  return h;
}

function explHTML(q, defaultOpen){
  const d = qd(q);
  const open = explOverride[q.id] !== undefined ? explOverride[q.id] : defaultOpen;
  let h = '<div class="expl '+(open?"open":"")+'" id="expl-'+q.id+'">';
  h += '<button class="expl-head" data-action="toggle-expl" data-qid="'+q.id+'">'

  h += '<div class="expl-sec"><span class="expl-label"><svg class="ico"><use href="#i-check"/></svg>'+esc(t("lblCorrect"))+' — '+LETTERS[q.correct]+'</span></div>';

  if(d.s && d.s.length){
    h += '<div class="expl-sec"><span class="expl-label"><svg class="ico"><use href="#i-chart"/></svg>'+esc(t("lblSteps"))+'</span><div class="steps">';
    d.s.forEach(s => { h += '<div class="step"><span class="step-txt">'+nl2br(s)+'</span></div>'; });

  }

    h += '<div class="expl-sec"><span class="expl-label"><svg class="ico"><use href="#i-x"/></svg>'+esc(t("lblOthers"))+'</span><div class="wrong-list">';

  h += '</div></div>';
  return h;
}

/* ===== Grades & tracking ===== */
function chartSVG(pcts){
  const W = 640, H = 230, PL = 38, PR = 16, PT = 18, PB = 30;
  const n = pcts.length;
  const x = i => n === 1 ? (W-PL-PR)/2 + PL : PL + i * (W-PL-PR) / (n-1);
  const y = p => PT + (100 - p) * (H-PT-PB) / 100;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  [0,25,50,75,100].forEach(g => {
    s += '<line class="chart-grid" x1="'+PL+'" y1="'+y(g)+'" x2="'+(W-PR)+'" y2="'+y(g)+'"/>'
       + '<text class="chart-lbl" x="'+(PL-6)+'" y="'+(y(g)+4)+'" text-anchor="end">'+g+'</text>';
  });
  s += '<line class="chart-pass" x1="'+PL+'" y1="'+y(70)+'" x2="'+(W-PR)+'" y2="'+y(70)+'"/>';
  if(n > 1){
    s += '<polyline class="chart-line" points="'+pcts.map((p,i)=>x(i)+","+y(p)).join(" ")+'"/>';
  }
  pcts.forEach((p,i) => {
    s += '<circle class="chart-dot" cx="'+x(i)+'" cy="'+y(p)+'" r="5"/>'
       + '<text class="chart-val" x="'+x(i)+'" y="'+(y(p)-10)+'" text-anchor="middle">'+p+'%</text>'
       + '<text class="chart-lbl" x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">#'+(i+1)+'</text>';
  });
  s += '</svg>';
  return s;
}

/* ---------------- exam engine ---------------- */
function buildQueue(){
  let pool = QB.filter(q => state.examSetup.secs.has(q.sec));   /* file (slide) order, always */
  const want = state.examSetup.count === "all" ? pool.length : parseInt(state.examSetup.count, 10);
  if(want > pool.length) return null;
  return { queue: pool.slice(0, want), picks: {}, idx: 0, t0: Date.now(), timer: null, n: Math.min(want, pool.length), done: false };
}
function startTimer(){
  stopTimer();
  if(state.exam) state.exam.timer = setInterval(() => {
    const el = $id("examTimerVal");
    if(el && state.exam) el.textContent = fmtTime(Date.now() - state.exam.t0);
  }, 1000);
}
function stopTimer(){ if(state.exam && state.exam.timer){ clearInterval(state.exam.timer); state.exam.timer = null; } }

function submitExam(){
  const ex = state.exam; if(!ex) return;
  const un = ex.queue.filter(q => ex.picks[q.id] === undefined).length;
  if(un > 0 && !confirm(t("examUnanswered").replace("{n}", un))) return;
  stopTimer();
  let correct = 0; const wrongIds = [];
  ex.queue.forEach(q => {
    const sel = ex.picks[q.id];
    const ok = sel !== undefined && sel === q.correct;
    if(ok) correct++; else wrongIds.push(q.id);
  });
  SESSION.answered = (SESSION.answered || 0) + ex.queue.filter(q => ex.picks[q.id] !== undefined).length;
  const pct = Math.round(correct / ex.n * 100);
  const rec = { ts: Date.now(), total: ex.n, correct: correct, pct: pct, secs: Math.max(1, Math.round((Date.now()-ex.t0)/1000)), wrong: wrongIds };
  P.exams.unshift(rec); if(P.exams.length > 20) P.exams.length = 20;
  P.dirty = true;
  save();
  ex.done = true;
  state.lastResult = rec;
  state.view = "results";
  render(); window.scrollTo({top:0});
}

/* ---------------- actions ---------------- */
function answer(qid, i){
  const q = QB.find(x => x.id === qid); if(!q) return;
  const first = !P.answers[qid];
  if(first) P.peeked = P.peeked.filter(x => x !== qid);
  P.answers[qid] = { sel: i, ok: i === q.correct, ts: Date.now() };
  if(first) SESSION.answered = (SESSION.answered || 0) + 1;
  P.dirty = true;
  save();
  explOverride[qid] = true;
  refreshCard(qid);
}
function peek(qid){
  const q = QB.find(x => x.id === qid); if(!q || P.answers[qid] || P.peeked.includes(qid)) return;
  P.peeked.push(qid);
  P.dirty = true;
  save();
  if(state.view === "study" && state.studyFilter === "unanswered") render();
  else refreshCard(qid);
}
function refreshCard(qid){
  const q = QB.find(x => x.id === qid);
  const el = $id("card-"+qid); if(!el || !q) { render(); return; }
  const tmp = document.createElement("div");
  tmp.innerHTML = cardHTML(q, {mode:"study"});
  el.replaceWith(tmp.firstElementChild);
  if(state.view === "dashboard") render();
}
function toggleBookmark(qid){
  const i = P.bookmarks.indexOf(qid);
  if(i >= 0){ P.bookmarks.splice(i,1); toast(t("toastUnbookmarked")); }
  else { P.bookmarks.push(qid); toast(t("toastBookmarked")); }
  save();
  /* update star in place so we don't disturb review/exam cards */
  const on = P.bookmarks.includes(qid);
  document.querySelectorAll('#card-'+qid+' [data-action="bm"]').forEach(btn => {
    btn.classList.toggle("on", on);
    const use = btn.querySelector("use"); if(use) use.setAttribute("href", on ? "#i-star" : "#i-star-o");
    btn.title = t(on ? "bookmarked" : "bookmark");
  });
  if(state.view === "dashboard") render();
  if(state.view === "study" && state.studyFilter === "bookmarked") render();
}

document.addEventListener("click", function(e){
  const nav = e.target.closest("[data-nav]");
  if(nav){ e.preventDefault(); go(nav.dataset.nav); return; }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action, qid = el.dataset.qid;

  switch(a){
    case "set-sec": state.studySec = el.dataset.sec; render(); break;
    case "set-filter": state.studyFilter = el.dataset.filter; render(); break;
    case "study-topic": state.studySec = el.dataset.sec; state.studyFilter = "all"; go("study"); break;
    case "quiz-topic":
      state.examSetup.secs = new Set([el.dataset.sec]);
      state.examSetup.count = "all";
      go("exam"); break;
    case "pick": answer(qid, parseInt(el.dataset.i,10)); break;
    case "peek": peek(qid); break;
    case "toggle-shuffle":
      P.shuffleOpts = !P.shuffleOpts;
      if(!P.shuffleOpts) P.order = {};
      save(); render(); break;
    case "next-q": {
      const list = studyPool().map(x => x.id);
      const nid = list[list.indexOf(qid) + 1];
      if(!nid){ toast(t("listEnd")); break; }
      const nc = $id("card-"+nid);
      if(nc){ nc.scrollIntoView({behavior:"smooth", block:"start"}); nc.classList.add("flash"); setTimeout(() => nc.classList.remove("flash"), 1400); }
      break;
    }
    case "retry":
      delete P.answers[qid]; delete explOverride[qid];
      P.peeked = P.peeked.filter(x => x !== qid);
      save(); refreshCard(qid); break;
    case "side-collapse": P.side.collapsed = !P.side.collapsed; save(); render(); break;
    case "side-fold": {
      const w = el.dataset.which;
      if(w === "topics" || w === "filters"){ P.side[w] = !P.side[w]; save(); render(); }
      break;
    }
    case "bm": toggleBookmark(qid); break;
    case "edit-name": showOnboarding(); break;
    case "sync-connect": {
      const inp = $id("syncUrlIn");
      P.syncUrl = inp ? inp.value.trim() : "";
      save(); toast(t("syncSaved")); render(); syncNow(true);
      break;
    }
    case "sync-now": syncNow(true); break;
    case "toggle-expl": {
      const box = $id("expl-"+qid);
      if(box){ const open = box.classList.toggle("open"); explOverride[qid] = open; }
      break;
    }
    case "exam-count": state.examSetup.count = el.dataset.n; render(); break;
    case "exam-sec": {
      const s = state.examSetup.secs, sec = el.dataset.sec;
      if(s.has(sec)) { if(s.size > 1) s.delete(sec); } else s.add(sec);
      render(); break;
    }
    case "start-exam": {
      const q2 = buildQueue();
      if(!q2){ toast(t("examNotEnough")); break; }
      state.exam = q2; state.view = "examRun"; render(); startTimer(); window.scrollTo({top:0});
      break;
    }
    case "exam-pick": {
      if(state.exam && !state.exam.done){
        state.exam.picks[qid] = parseInt(el.dataset.i,10);
        render(); startTimerKeep();
        const card = $id("card-"+qid); if(card) card.scrollIntoView({block:"nearest"});
      }
      break;
    }
    case "exam-goto": if(state.exam){ state.exam.idx = Math.min(state.exam.n-1, Math.max(0, parseInt(el.dataset.i,10))); render(); startTimerKeep(); } break;
    case "exam-move": if(state.exam){ examMove(parseInt(el.dataset.d,10)); } break;
    case "exam-submit": submitExam(); break;
    case "retry-wrong": {
      if(state.exam && state.exam.picks){   /* seed a fresh ephemeral session from the exam attempt */
        state.exam.queue.forEach(qq => { const sp = state.exam.picks[qq.id];
          if(sp !== undefined) P.answers[qq.id] = { sel: sp, ok: sp === qq.correct, ts: Date.now() }; });
        save();
      }
      state.view = "study"; state.studySec = "all"; state.studyFilter = "wrong"; render(); window.scrollTo({top:0}); break;
    }
    case "show-bookmarks": state.view = "study"; state.studySec = "all"; state.studyFilter = "bookmarked"; render(); window.scrollTo({top:0}); break;
    case "retake": {
      const q3 = buildQueue();
      if(!q3){ toast(t("examNotEnough")); break; }
      state.exam = q3; state.view = "examRun"; render(); startTimer(); window.scrollTo({top:0});
      break;
    }
    case "reset":
      if(confirm(t("resetConfirm"))){
        P.answers = {}; P.bookmarks = []; P.exams = []; P.peeked = []; P.order = {};
        Object.keys(explOverride).forEach(k => delete explOverride[k]);
        save(); render(); toast(t("toastReset"));
      }
      break;
  }
});

function startTimerKeep(){ if(state.exam && !state.exam.timer) startTimer(); }
function examMove(d){
  if(!state.exam) return;
  const ni = state.exam.idx + d;
  if(ni < 0 || ni >= state.exam.n) return;
  state.exam.idx = ni; render(); startTimerKeep();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------------- language & theme ---------------- */
$id("langBtn").addEventListener("click", () => {
  P.lang = P.lang === "en" ? "ar" : "en";
  save(); render(); toast(t("toastLang"));
  if(document.getElementById("onb")) showOnboarding();
  window.scrollTo({top:0});
});
$id("themeBtn").addEventListener("click", () => {
  P.theme = P.theme === "dark" ? "light" : "dark";
  save(); applyChrome();
});

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e => {
  if(e.target && typeof e.target.matches === "function" && e.target.matches("input, textarea, select")) return;
  if((e.ctrlKey || e.metaKey) && e.shiftKey && e.code === "KeyS"){
    e.preventDefault();
    P.syncAdmin = !P.syncAdmin; save(); render();
    toast(P.syncAdmin ? t("syncAdminOn") : t("syncAdminOff"));
    return;
  }
  const k = e.key.toLowerCase();
  let idx = -1;
  if(["a","b","c","d"].includes(k)) idx = "abcd".indexOf(k);
  else if(["1","2","3","4"].includes(e.key)) idx = parseInt(e.key,10) - 1;
  if(idx >= 0){
    if(state.view === "examRun" && state.exam && !state.exam.done){
      const q = state.exam.queue[state.exam.idx];
      state.exam.picks[q.id] = getOrder(q.id)[idx]; render(); startTimerKeep(); e.preventDefault(); return;
    }
    if(state.view === "study"){
      const q = firstAnswerable();
      if(q){ answer(q.id, getOrder(q.id)[idx]); e.preventDefault(); }
    }
  }
  if(state.view === "examRun" && state.exam && !state.exam.done){
    if(e.key === "ArrowRight"){ examMove(P.lang === "ar" ? -1 : 1); e.preventDefault(); }
    if(e.key === "ArrowLeft"){ examMove(P.lang === "ar" ? 1 : -1); e.preventDefault(); }
  }
});
function firstAnswerable(){
  const cards = Array.from(document.querySelectorAll(".q-card"));
  for(const c of cards){
    const r = c.getBoundingClientRect();
    if(r.bottom > 130 && !P.answers[c.dataset.qid]) return QB.find(q => q.id === c.dataset.qid);
  }
  return QB.find(q => studyPool().includes(q) && !P.answers[q.id]) || null;
}

/* ---------------- onboarding (name registration) ---------------- */
function showOnboarding(){
  let ov = document.getElementById("onb");
  if(ov) ov.remove();
  ov = document.createElement("div"); ov.id = "onb"; ov.className = "onb-overlay";
  ov.innerHTML = '<div class="card onb-card">'
    + '<span class="brand-ico onb-ico"><svg class="ico"><use href="#i-logo"/></svg></span>'
    + '<h2>'+esc(t("onbTitle"))+'</h2>'
    + '<p class="muted">'+esc(t("onbText"))+'</p>'
    + '<input id="nameInput" class="txt-in" maxlength="40" autocomplete="off" placeholder="'+esc(t("onbPlaceholder"))+'" value="'+esc(P.name||"")+'">'
    + '<p class="onb-err" id="onbErr"></p>'
    + '<button class="btn btn-primary onb-btn" id="onbStart"><svg class="ico"><use href="#i-flag"/></svg>'+esc(t("onbStart"))+'</button>'
    + '</div>';
  document.body.appendChild(ov);
  const inp = document.getElementById("nameInput");
  setTimeout(() => inp && inp.focus(), 60);
  const commit = () => {
    const v = inp.value.trim();
    if(!v){ document.getElementById("onbErr").textContent = t("onbErr"); inp.focus(); return; }
    P.name = v; P.dirty = true; save(); ov.remove(); render();
    if(P.syncUrl) syncNow(false);
  };
  document.getElementById("onbStart").addEventListener("click", commit);
  inp.addEventListener("keydown", e => { if(e.key === "Enter") commit(); });
}

/* ---------------- session / sign-in tracking ---------------- */
P.visits = (P.visits || 0) + 1;
if(!P.firstVisit) P.firstVisit = Date.now();
P.sessions.unshift({ start: Date.now(), secs: 0, answered: 0 });
if(P.sessions.length > 30) P.sessions.length = 30;
const SESSION = P.sessions[0];
function touchSession(){ SESSION.secs = Math.round((Date.now() - SESSION.start) / 1000); }
setInterval(() => { touchSession(); save(); }, 20000);
window.addEventListener("pagehide", () => {
  touchSession(); save();
  if(P.syncUrl && typeof navigator !== "undefined" && navigator.sendBeacon){
    try{ navigator.sendBeacon(P.syncUrl, new Blob([JSON.stringify(syncPayload())], {type:"text/plain"})); }catch(e){}
  }
  clearStudyTrace();
});

/* ---------------- Google Sheets sync (Apps Script backend) ---------------- */
if(!P.sid) P.sid = "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
function syncPayload(){
  touchSession();
  const pm = pracMerged();
  P.exams.forEach(r => { if(!r.eid) r.eid = r.ts + "-" + Math.random().toString(36).slice(2,7); });
  return {
    action: "sync",
    student: { sid: P.sid, name: P.name, firstVisit: P.firstVisit, lastSeen: Date.now(),
               visits: P.visits, totalSecs: totalSecs(),
               practiceCorrect: pm.correct, practiceSelections: pm.selections, topics: pm.topics },
    exams: P.exams.map(r => ({ eid:r.eid, sid:P.sid, name:P.name, ts:r.ts, total:r.total, correct:r.correct, pct:r.pct, secs:r.secs })),
    sessions: P.sessions.map(s => ({ ssid:String(s.start), sid:P.sid, name:P.name, ts:s.start, secs:s.secs||0, answered:s.answered||0 }))
  };
}
function postSync(body){
  if(typeof fetch !== "function") return Promise.reject(new Error("no-fetch"));
  return fetch(P.syncUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
    redirect: "follow"
  }).then(r => { if(!r.ok) throw new Error("http " + r.status); return r.json().catch(() => ({})); });
}
function syncNow(manual){
  if(!P.syncUrl){ if(manual) toast(t("syncNoUrl")); return Promise.resolve(false); }
  const batch = P.queue.concat([syncPayload()]);
  return postSync(batch).then(res => {
    if(res && res.ok === false) throw new Error(res.error || "server");
    P.queue = []; P.lastSync = Date.now(); P.dirty = false; save();
    if(manual) toast(t("syncOk"));
    updateSyncStatus();
    return true;
  }).catch(() => {
    batch.forEach(p => P.queue.push(p));
    if(P.queue.length > 5) P.queue.splice(0, P.queue.length - 5);
    save();
    if(manual) toast(t("syncFail"));
    updateSyncStatus();
    return false;
  });
}
function updateSyncStatus(){
  const el = $id("syncStatus"); if(!el) return;
  el.innerHTML = esc(t("syncLast")) + ': <b>' + (P.lastSync ? esc(fmtDate(P.lastSync)) : esc(t("syncNever"))) + '</b>'
    + (P.queue.length ? ' · <span class="badge badge-peek">' + P.queue.length + ' ' + esc(t("syncQueue")) + '</span>' : '')
    + (P.syncUrl ? ' · <span class="ltr muted" style="font-size:.75rem">' + esc(P.syncUrl.slice(0, 46)) + '…</span>' : '');
}
setInterval(() => { if(P.syncUrl && (P.queue.length || P.dirty)) syncNow(false); }, 60000);

/* ---------------- boot ---------------- */
render();
if(!P.name) showOnboarding();
if(P.name && P.syncUrl) setTimeout(() => syncNow(false), 1500);   /* silent background sync on load */

})();

</script>
